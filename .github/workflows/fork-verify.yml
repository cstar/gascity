name: fork-verify

# Minimal fork-only CI for gascity forks. Verifies WIP feature branches
# WITHOUT upstream's Blacksmith
# self-hosted runners, runner-policy gating, or secrets — none of which a fork
# has. ubuntu-latest compiles the Dolt go-icu-regex CGO dependency cleanly; the
# `unicode/regex.h` build failure is macOS-only (icu4c@78 header layout), so a
# Linux runner is exactly what's needed to get a real green/red signal.
#
# Reuses the upstream composite action .github/actions/setup-gascity-ubuntu so
# the Go + Dolt + native-dependency setup is not re-solved here.

on:
  push:
    branches: ["feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Canonical PR branches already run the complete Blacksmith CI graph.
    # This lightweight fallback exists only for forks that cannot use those
    # runners or repository secrets.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    env:
      DOLT_VERSION: "2.1.7"
      BD_VERSION: "v1.3.0-rc.2"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ""
          install-claude-cli: "false"
      - name: Build bd from the same approved module as GC
        shell: bash
        run: |
          go mod download github.com/steveyegge/beads
          beads_dir="$(go list -m -f '{{.Dir}}' github.com/steveyegge/beads)"
          mkdir -p "$RUNNER_TEMP/paired-beads"
          (cd "$beads_dir" && CGO_ENABLED=1 go build -p 2 -o "$RUNNER_TEMP/paired-beads/bd" ./cmd/bd)
          echo "$RUNNER_TEMP/paired-beads" >> "$GITHUB_PATH"
      - name: Native dependency surface
        run: make check-native-dependency-surface
      - name: Build (compiles the whole tree — catches compile errors the macOS ICU break hides)
        run: go build ./...
      - name: Vet changed package
        run: go vet ./cmd/gc/...
      - name: Unit tests — cross-store work delivery
        run: go test ./cmd/gc/ -run 'TestFilterAssignedWorkBeads|TestAssignedWork|TestFirstStoreWithWork|TestCrossStoreClaimDir|TestRunBDForBead|TestGateOpenWorkBounded|TestCrossStorePipeline' -count=1 -v
      - name: Unit tests — cross-store reachability predicate + fail-loud guard
        run: |
          go test ./internal/agentutil/ -run 'TestAgentReachesWorkflowStore|TestAgentIsCrossStoreEligible' -count=1 -v
          go test ./internal/sling/ -run 'TestValidateBuiltInRouteStoreReachableAllowsCityScopedTarget|TestDoSlingRefusesCrossStore' -count=1 -v
      - name: Unit tests — order scope (#2830)
        run: go test ./internal/orders/ -run 'TestParseScope|TestValidateRejectsUnknownScope|TestValidateAcceptsCityAndRigScope|TestParseEnv' -count=1 -v
      - name: Unit tests — scale from zero (#2819)
        run: go test ./cmd/gc/ -run 'TestBuildDesiredState_ScaleFromZero' -count=1 -v
      - name: Unit tests — city stability and approved dependency guards
        run: |
          go test ./cmd/gc/ -run 'TestWorkflowScopedWake|TestBdByIDConditional|TestModuleGraphOnlyApprovedReplacements|TestApprovedForkBeadsReplacementIsExact|TestDeliverSessionNudgeWaitIdleDeliversToIdleCodexAlias' -count=1
          go test ./examples/bd/dolt/ -run 'TestDoctorScriptHealthySweepsRecordedAdvisory|TestDoctorScriptSteadyHealthySkipsSweep|TestDoctorScriptAdvisorySweepPrecedesFreshSend' -count=1
          go test ./scripts/ -run '^TestCheckGomodReplaceGuard' -count=1
      - name: Managed Dolt integration with paired bd (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 30
        run: ./scripts/test-integration-shard packages-cmd-gc-integration
      - name: Full fast unit qualification (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 90
        env:
          CGO_ENABLED: "0"
          GOMAXPROCS: "2"
        run: make test-fast-parallel LOCAL_TEST_JOBS=2 EXTRA_TEST_ENV='GOMAXPROCS=2 CGO_ENABLED=0 GC_TEST_INNER_P=2'
